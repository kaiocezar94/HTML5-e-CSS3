<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>exercicio</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .header{
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 10px;
            padding: 15px 0;
        }
        a{
            text-decoration: none;
            background-color: black;
            color: rgb(175, 142, 52);
            font-size: 20px;
            padding: 15px 25px;
            transition: all 0.2s;
        }

        a#main{
            background-color: rgb(97, 90, 90);
            color: white;
        }

        a.outro:hover{
            background-color: rgb(59, 57, 57);
            border-bottom: 3px solid rgba(118, 102, 102, 0.989);
        }
        
        a:active{
            transform: scale(0.95);
        }
    </style>
</head>
<body>
    <div class="header">
        <a target="_blank" id="main" href="">Inicio</a>
        <a target="_blank" class="outro" href="">Serviços</a>
        <a target="_blank" class="outro" href="">Portfólio</a>
        <a target="_blank" class="outro" href="">Contacto</a>
    </div>
</body>
</html>
