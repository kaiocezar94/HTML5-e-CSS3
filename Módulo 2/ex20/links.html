<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>
</head>
<style>
    body{
        font-family: Verdana, Geneva, Tahoma, sans-serif;
    }

    a{
        color: red;
        text-decoration: none;
        font-weight: bold;
    }

    a:visited{
        color: darkred;
    }

    a:hover{
        text-decoration: underline;
        color: black;
    }

    a:active{
        color: yellow;
    }
    a.especial::before{
        content: '→ ';
        text-decoration: none;
        color: darkgrey;
    }

    a.especial::after{
        content: ' ←';
       text-decoration: none;   
       color: darkgrey;

    }
</style>
<body>
    <h1>Personalizando links</h1>
    <ul>
        
            <li><a target="_blank" href="https://gustavoguanabara.github.io">
                Repositorio GitHub</a></li>
            
            <li><a href="https://youtube.com/cursoemvideo" class="especial">
        Canal do Youtube</a></li>
        
            <li><a href="https://www.cursoemvideo.com">
        site do cursoemvideo</a></li>
    </ul>
</body>
</html>
