<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TAGS HTML</title>
</head>
<body>
    <h1>Tags em HTML</h1>
    <p>Em HTML5, podemos inserir os elementos da lista a seguir. Passe o mouse sobre os termos para descobrir qual tag deverá utilizr em cada caso.</p>
    <ul type="square">
        <li><abbr title="Use a tag &lt;p&gt;">Parágrafos</abbr></li>
        <li><abbr title="Use a tag <abbr>">abreviaçao</abbr></li>
        <li><abbr title="Use a tag <h1 a h6>">titulos</abbr></li>
        <li><abbr title="Use a tag <strong>">Negrito</abbr></li>
        <li><abbr title="Use a tag <em>">Italico</abbr></li>
        <li><abbr title="Use a tag <span>">palavra ou texto curto</abbr></li>
        <li><abbr title="Use a tag <table>">Tabelas</abbr></li>
        <li><abbr title="Use a tag <form>">Formularios</abbr></li>
    </ul>
</body>
</html>
