<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Midias em HTML5</title>
</head>
<body>
    <h1>Fotos Adaptáveis</h1>
    <p>Em html5 podemos colocar imagens que se adaptam ao tamanho da tela diretamente pela tag picture</p>
    <picture>
        <source media="(max-width: 350px)" srcset="imagens/kaio-p.jpg" type="image/jpg">
        <source media="(max-width: 750px)" srcset="imagens/kaio-m.jpg" type="image/jpg">
        <source media="(max-width: 1050px)" srcset="imagens/kaio-g.jpg" type="image/jpg">
        <img src="imagens/AeK (917).JPG" alt="Foto do casamento K&A">
    </picture>
    
</body>
</html>
